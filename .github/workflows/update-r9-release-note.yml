name: Update R9 release recovery-network note

on:
  push:
    paths:
      - ".github/workflows/update-r9-release-note.yml"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "407031851"
      RELEASE_BODY: |
        ## DragonBreath v1.1.19-r9

Custom DragonBreath firmware based on v1.1.19.

### Changes

- Persistent AUTO/OFF preference across reboot
- Optional high-bed-setpoint AUTO preheat trigger
- Bambu remains the printer/AUTO source while Home Assistant can operate alongside it
- Added Home Assistant:
  - Enable telemetry
  - Allow Home Assistant control
- Native Home Assistant climate modes:
  - Off
  - Heat
  - Auto
- AUTO + target change:
  - updates the AUTO target
  - remains in AUTO
  - does not start manual HEAT
- HEAT + target change:
  - updates the manual target
  - remains in HEAT
- OFF + target change:
  - stores the manual setpoint
  - remains OFF
  - does not start the heater
- OTA/restart permitted while AUTO is armed but genuinely idle
- OTA/restart remains blocked while heater demand/output is active
- Customized DragonBreath web UI with AUTO/bed-preheat controls
- Home Assistant configuration examples included in the repository


### Screenshots

#### AUTO mode and bed-preheat controls

<p>
<img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/auto-bed-preheat.png" width="390" alt="R9 automatic mode with optional high-bed preheat trigger">
<img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/home-assistant-mqtt.png" width="390" alt="R9 Home Assistant MQTT telemetry and control options">
</p>

#### Home Assistant dashboard

| AUTO | HEAT | OFF |
|:---:|:---:|:---:|
| <img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/home-assistant-auto.png" width="250" alt="Home Assistant card in AUTO mode"> | <img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/home-assistant-heat.png" width="250" alt="Home Assistant card in HEAT mode"> | <img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/home-assistant-off.png" width="250" alt="Home Assistant card in OFF mode with locked target"> |

#### Setup / recovery access point

<img src="https://raw.githubusercontent.com/fbriceno97/DragonBreath/main/docs/screenshots/r9/setup-recovery-ap.png" width="695" alt="DragonBreath setup and recovery access-point settings using privacy-sanitized example values">

> Screenshots are privacy-sanitized. Live LAN addresses, account names, and device-specific identifiers have been replaced with documentation-only example values.

### Firmware

`dragonbreath-mod-r9-off-slider-setpoint-only-latest.bin`

### SHA256

`cce5d533b7eac5cb163211e9a2785be3b7ebfb3c579b6651c3cbc3dd5b0ee70f`

Built for ESP32-C3 using ESP-IDF v5.3.5.

## What's Changed
* Custom DragonBreath R9 firmware by @fbriceno97 in https://github.com/fbriceno97/DragonBreath/pull/1

**Full Changelog**: https://github.com/fbriceno97/DragonBreath/commits/v1.1.19-r9

    steps:
      - name: Update release body
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field body="${RELEASE_BODY}"
