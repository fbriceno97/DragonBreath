type: vertical-stack
cards:
  - type: custom:banner-card
    heading:
      - mdi:radiator
      - DragonBreath
    row_size: 3
    entities:
      - entity: sensor.mosquitto_mqtt_broker_dragonbreath_chamber
        name: Chamber
        unit: °C
      - entity: sensor.mosquitto_mqtt_broker_dragonbreath_element
        name: Element
        unit: °C
      - entity: climate.dragonbreath_dragonbreath
        name: Mode

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: climate.dragonbreath_dragonbreath
        name: Auto
        icon: mdi:autorenew
        show_state: false
        color_type: icon
        color: white
        state:
          - value: auto
            color: "#4CAF50"
            styles:
              name:
                - color: "#4CAF50"
        styles:
          icon:
            - color: white
          name:
            - color: white
        tap_action:
          action: call-service
          service: mqtt.publish
          data:
            topic: dragonbreath/mode/set
            payload: auto
            qos: 1
            retain: false

      - type: custom:button-card
        entity: climate.dragonbreath_dragonbreath
        name: Heat
        icon: mdi:fire
        show_state: false
        color_type: icon
        color: white
        state:
          - value: heat
            color: "#FF9800"
            styles:
              name:
                - color: "#FF9800"
        styles:
          icon:
            - color: white
          name:
            - color: white
        tap_action:
          action: call-service
          service: mqtt.publish
          data:
            topic: dragonbreath/mode/set
            payload: heat
            qos: 1
            retain: false

      - type: custom:button-card
        entity: climate.dragonbreath_dragonbreath
        name: "Off"
        icon: mdi:power
        show_state: false
        color_type: icon
        color: white
        state:
          - value: "off"
            color: "#F44336"
            styles:
              name:
                - color: "#F44336"
        styles:
          icon:
            - color: white
          name:
            - color: white
        tap_action:
          action: call-service
          service: mqtt.publish
          data:
            topic: dragonbreath/mode/set
            payload: "off"
            qos: 1
            retain: false

  - type: conditional
    conditions:
      - condition: state
        entity: climate.dragonbreath_dragonbreath
        state_not: "off"
    card:
      type: custom:slider-button-card
      entity: number.dragonbreath_target_celsius
      name: Chamber Target
      show_name: true
      show_state: true
      compact: false
      slider:
        direction: left-right
        background: triangle
        show_track: true
        use_state_color: true
      icon:
        icon: mdi:thermometer
        show: true
        tap_action:
          action: none
      action_button:
        show: false

  - type: conditional
    conditions:
      - condition: state
        entity: climate.dragonbreath_dragonbreath
        state: "off"
    card:
      type: custom:button-card
      name: Chamber Target
      label: 0 °C
      icon: mdi:thermometer
      show_name: true
      show_label: true
      show_icon: true
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      custom_fields:
        slider: >
          [[[
            return `
              <div style="
                position:relative;
                width:100%;
                height:10px;
                background:rgba(255,255,255,0.18);
                border-radius:10px;
              ">
                <div style="
                  position:absolute;
                  left:0;
                  top:50%;
                  width:20px;
                  height:20px;
                  transform:translate(-2px,-50%);
                  border-radius:50%;
                  background:#9e9e9e;
                "></div>
              </div>
            `;
          ]]]
      styles:
        card:
          - height: 118px
          - opacity: 0.55
          - cursor: default
          - pointer-events: none
          - padding: 14px
        grid:
          - grid-template-areas: '"i n" "i l" "slider slider"'
          - grid-template-columns: 40px 1fr
          - grid-template-rows: auto auto 1fr
        icon:
          - color: "#bdbdbd"
          - width: 28px
        name:
          - justify-self: start
          - color: "#bdbdbd"
          - font-size: 18px
        label:
          - justify-self: start
          - color: "#bdbdbd"
          - font-size: 18px
        custom_fields:
          slider:
            - width: 100%
            - align-self: end
            - padding-top: 18px
